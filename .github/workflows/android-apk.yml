name: Android APK

on:
  push:
    branches:
      - main
      - feature/android-v1-complete
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Android project not present on this ref; CI bootstrap only."
          fi

      - name: Set up Java 17
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.project.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        if: steps.project.outputs.present == 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        if: steps.project.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare persistent update signing key
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/purchase-sales-signing"
          base64 --decode ci-signing/purchase-sales-update.keystore.b64 > "$RUNNER_TEMP/purchase-sales-signing/purchase-sales-update.keystore"
          echo "PURCHASE_SALES_KEYSTORE_PATH=$RUNNER_TEMP/purchase-sales-signing/purchase-sales-update.keystore" >> "$GITHUB_ENV"
          echo "PURCHASE_SALES_KEYSTORE_PASSWORD=purchasesales-ci" >> "$GITHUB_ENV"
          echo "PURCHASE_SALES_KEY_ALIAS=purchasesales" >> "$GITHUB_ENV"
          echo "PURCHASE_SALES_KEY_PASSWORD=purchasesales-ci" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: steps.project.outputs.present == 'true'
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify persistent APK signature
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee apk-signature.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signature.txt | head -n 1 | tr '[:lower:]' '[:upper:]')
          EXPECTED="9F66F2FCEEABC2A37B5327EA45B73E1C6262196DE53DE2772CB8034D86F1923D"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Unexpected APK signing certificate: $ACTUAL"
            exit 1
          fi
          echo "Persistent signing certificate verified: $ACTUAL"

      - name: Upload installable APK
        if: steps.project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Purchase-Sales-Software-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
